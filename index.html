    <script>
        (function () {
            const track = document.getElementById('track');
            const toggleBtn = document.getElementById('toggleBtn');
            let isPaused = false;

            // pausa/retoma ao clicar no botão
            toggleBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                track.classList.toggle('paused', isPaused);
                toggleBtn.textContent = isPaused ? 'Retomar' : 'Pausar';
                toggleBtn.setAttribute('aria-pressed', String(isPaused));
            });

            // pausa ao passar o mouse e retoma ao sair
            track.addEventListener('mouseenter', () => {
                track.classList.add('paused');
            });
            track.addEventListener('mouseleave', () => {
                if (!isPaused) track.classList.remove('paused');
            });

            // touch: pausa ao tocar e retoma ao soltar (melhora experiência mobile)
            let touchTimer = null;
            track.addEventListener('touchstart', () => {
                track.classList.add('paused');
                if (touchTimer) clearTimeout(touchTimer);
            }, { passive: true });
            track.addEventListener('touchend', () => {
                // pequeno atraso para evitar reativar enquanto o usuário ainda interage
                touchTimer = setTimeout(() => { if (!isPaused) track.classList.remove('paused'); }, 300);
            });

            // acessibilidade: se o usuário focar elementos dentro do carrossel, pausa
            document.querySelectorAll('.carousel [tabindex], .carousel button, .carousel a, .carousel input').forEach(el => {
                el.addEventListener('focus', () => track.classList.add('paused'));
                el.addEventListener('blur', () => { if (!isPaused) track.classList.remove('paused') });
            });

            // toque simples para alternar pausa/retomar com dois toques rápidos (opcional)
            // (não obrigatório — comente se não desejar)
            let lastTap = 0;
            track.addEventListener('touchend', () => {
                const now = Date.now();
                if (now - lastTap < 300) { // duplo toque
                    isPaused = !isPaused;
                    track.classList.toggle('paused', isPaused);
                    toggleBtn.textContent = isPaused ? 'Retomar' : 'Pausar';
                    toggleBtn.setAttribute('aria-pressed', String(isPaused));
                }
                lastTap = now;
            });

        })();
    </script>
